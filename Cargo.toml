[workspace]
members = [
  "crates/*"
]
exclude = [
  # ignoring for now
  "crates/gtk4"
]
resolver = "3"

[workspace.dependencies]
tracing = "0.1"
http = "1"
hyper-rustls = "0.27"
seccompiler = "0.5"
simd-json = "0.18"
dbus = "0.9"
bitflags = "2"
libc = "0.2"
itoa = "1"
lexopt = "0.3"

[workspace.dependencies.libdbus-sys]
version = "0.2"
features = ["vendored"]

[workspace.dependencies.bytemuck]
version = "1"
default-features = false
features = ["derive", "must_cast"]

[workspace.dependencies.uuid]
version = "1"
features = ["v4"]

[workspace.dependencies.linux-raw-sys]
version = "0.12"
features = ["netlink", "net", "errno", "general", "ioctl", "prctl"]

[workspace.dependencies.futures]
version = "0.3"
default-features = false
features = ["std"]

[workspace.dependencies.tokio]
version = "1"
# TODO: prune feature set here
features = ["full"]

[workspace.dependencies.hyper]
version = "1"
features = ["client", "http2", "http1"]

[workspace.dependencies.simd-json-derive]
version = "0.18"
default-features = false

# internal crates

[workspace.dependencies.bubblebox]
path = "crates/bubblebox"

[workspace.dependencies.meowix]
path = "crates/meowix"
features = ["alloc"]

[workspace.dependencies.layer-cake-core]
path = "crates/core"

[workspace.dependencies.layer-cake-modrinth]
path = "crates/modrinth"

[workspace.dependencies.layer-cake-mojang]
path = "crates/mojang"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
lto = "fat"

[profile.release-profile]
inherits = "release"
debug = true
strip = false

[workspace.lints.rust]
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
# Kani will trigger this lint otherwise
check-cfg = ['cfg(kani)']

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
cargo_common_metadata = "warn"
dbg_macro = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

allow_attributes = "deny"
arithmetic_side_effects = "deny"
await_holding_lock = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
default_trait_access = "deny"
doc_markdown = "deny"
empty_enums = "deny"
enum_glob_use = "deny"
exit = "deny"
expect_used = "deny"
explicit_deref_methods = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
fallible_impl_from = "deny"
filetype_is_file = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
fn_params_excessive_bools = "deny"
imprecise_flops = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
inefficient_to_string = "deny"
infinite_iter = "deny"
integer_division = "deny"
large_digit_groups = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
manual_filter_map = "deny"
match_like_matches_macro = "deny"
missing_const_for_fn = "deny"
missing_errors_doc = "deny"
missing_safety_doc = "deny"
modulo_arithmetic = "deny"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "deny"
mut_mut = "deny"
option_option = "deny"
panic = "deny"
panic_in_result_fn = "deny"
ptr_as_ptr = "deny"
redundant_clone = "deny"
redundant_else = "deny"
ref_as_ptr = "deny"
rest_pat_in_fully_bound_structs = "deny"
semicolon_if_nothing_returned = "deny"
should_implement_trait = "deny"
single_match_else = "deny"
str_to_string = "deny"
transmute_ptr_to_ptr = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern  = "deny"
unused_self = "deny"
unwrap_used = "deny"
use_self = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
zero_sized_map_values = "deny"
